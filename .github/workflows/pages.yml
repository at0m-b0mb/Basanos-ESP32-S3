# Publish the browser flasher.
#
# The firmware is copied into the site rather than linked from the release.
# GitHub's release assets carry no CORS header, so a browser flasher fetching
# one is blocked — the page loads, the button appears, and flashing fails with
# nothing useful on screen. A same-origin copy avoids that entirely.
name: pages

# Triggered from main, not from the tag.
#
# The github-pages environment only accepts deployments from the default
# branch, so a tag-triggered run builds the site perfectly and is then refused
# at the deploy step. Tagging a release moves main too, so building from main
# publishes the same commit -- and the version below is read from the nearest
# tag rather than from the ref, so the page still names the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe needs the tags

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: >
            idf.py build &&
            esptool.py --chip esp32s3 merge_bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            -o build/basanos-esp32s3.bin
            0x0     build/bootloader/bootloader.bin
            0x8000  build/partition_table/partition-table.bin
            0x10000 build/basanos.bin

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/flasher/. _site/
          cp build/basanos-esp32s3.bin _site/firmware.bin
          cp assets/banner.svg _site/ 2>/dev/null || true
          # The manifest points at the same-origin copy, never the release.
          # The nearest tag, so the page names the release rather than the
          # branch it happened to be built from.
          VER="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          sed -i "s/__VERSION__/${VER}/" _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
